[project]
name = "jaime"
version = "0.2.0"
description = "Jaime — assistente pessoal com voz, memória Obsidian e acesso ao computador (Claude Agent SDK)"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "psutil>=5.9",
  "openai>=1.50",
  "apscheduler>=3.10,<4",
  "holidays>=0.50",
  "playwright>=1.45",
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.2",
  "static-ffmpeg>=2.7",
  "pyautogui>=0.9",
  # reconhecimento de falante (resemblyzer + torch 2.2.2, o último com build para Mac Intel) exige numpy 1.x e scipy 1.13
  "numpy<2",
  "scipy<1.14",
  "torch==2.2.2",
  "librosa>=0.10",
  "webrtcvad-wheels",
  "resemblyzer>=0.1.4",
  # macOS Intel: cryptography >= 49 não publica wheel x86_64 e a compilação exige OpenSSL/Rust
  'cryptography<49; sys_platform == "darwin" and platform_machine == "x86_64"',
]

[project.optional-dependencies]
voice = [
  "pvporcupine>=3.0",
  "sounddevice>=0.4",
  "numpy>=1.26",
  "faster-whisper>=1.0",
  "elevenlabs>=1.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
jaime = "jaime.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jaime*"]
